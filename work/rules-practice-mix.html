<div class="viz-dotted-background" id="rules-practice-mix">
  <section class="mix-window" aria-labelledby="rules-mix-title">
    <header class="mix-header">
      <div>
        <h2 id="rules-mix-title">Practice mix</h2>
        <p>Local profile</p>
      </div>
      <span class="mix-mode">Custom</span>
    </header>
    <div class="mix-bars">
      <div class="mix-bar-row">
        <span>Target split</span>
        <div class="mix-track" role="img" aria-label="Target split: 80% AtCoder, 20% Codeforces">
          <span class="mix-atcoder"></span><span class="mix-codeforces"></span>
        </div>
      </div>
      <div class="mix-bar-row">
        <span>Next 20 problems</span>
        <div class="mix-track mix-queue" role="img" aria-label="Queue preview: 16 AtCoder problems, 4 Codeforces problems">
          <span class="mix-atcoder"></span><span class="mix-codeforces"></span>
        </div>
      </div>
    </div>
    <div class="mix-sources">
      <div class="mix-columns" aria-hidden="true">
        <span>Source</span><span>Target</span><span>In preview</span><span></span>
      </div>
      <details class="mix-source" open>
        <summary class="mix-columns">
          <span class="mix-name"><i class="mix-atcoder" aria-hidden="true"></i>AtCoder</span>
          <span aria-label="80 percent target">80%</span><span aria-label="16 problems in preview">16</span><span class="mix-arrow" aria-hidden="true">›</span>
        </summary>
        <ul>
          <li class="mix-columns"><span>ABC grind</span><span></span><span aria-label="13 problems in preview">13</span></li>
          <li class="mix-columns"><span>ARC grind</span><span></span><span aria-label="3 problems in preview">3</span></li>
        </ul>
      </details>
      <details class="mix-source">
        <summary class="mix-columns">
          <span class="mix-name"><i class="mix-codeforces" aria-hidden="true"></i>Codeforces</span>
          <span aria-label="20 percent target">20%</span><span aria-label="4 problems in preview">4</span><span class="mix-arrow" aria-hidden="true">›</span>
        </summary>
        <ul>
          <li class="mix-columns"><span>Div. 2 upsolve</span><span></span><span aria-label="3 problems in preview">3</span></li>
          <li class="mix-columns"><span>Div. 4 upsolve</span><span></span><span aria-label="1 problem in preview">1</span></li>
        </ul>
      </details>
    </div>
  </section>
</div>
<style>

</style>
