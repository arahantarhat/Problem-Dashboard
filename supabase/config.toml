project_id = "unified-training"

[auth]
site_url = "http://127.0.0.1:4173"
enable_signup = true
minimum_password_length = 8

[auth.email]
enabled = true
enable_confirmations = true
otp_length = 6

[auth.email.template.confirmation]
subject = "Confirm your Unified Training account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Unified Training password"
content_path = "./supabase/templates/recovery.html"

[realtime]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
